<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ediz IT Institute - Certificate Verification Portal. Verify student enrollment status, course completion, and certificate validity instantly.">
    <title>Certificate Verification Portal | Ediz IT Institute</title>
    
    <!-- Stylesheets -->
    <link rel="icon" href="Logo-05.png" type="image/png">
    <link rel="shortcut icon" href="Logo-05.png" type="image/png">
    <link rel="stylesheet" href="https://admin.edizit.com/styles.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .verification-card {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- --- NAVIGATION BAR --- -->
    <nav class="navbar glass-panel" style="justify-content: center; padding: 0.75rem 2rem;">
        <div class="nav-brand">
            <a href="https://edizit.com">
                <img id="nav-logo" src="Logo-03.png" alt="Ediz IT Institute Logo" class="nav-logo" style="height: 50px;">
            </a>
        </div>
    </nav>

    <!-- --- MAIN PORTAL --- -->
    <main class="main-container">
        <div class="verification-card glass-card">
            <div style="padding: 2.5rem;">
                <div class="section-header" style="margin-bottom: 2rem; text-align: center;">
                    <span class="section-tag" style="margin: 0 auto 0.5rem auto;">Verification Portal</span>
                    <h2 class="section-title" style="font-size: 1.75rem; font-weight: 800;">Verify Certificate & Enrollment</h2>
                    <p class="section-desc" style="max-width: 500px; margin: 0.5rem auto 0 auto;">Input a student's ID number below to instantly verify their enrollment status, batch details, and graduation certificates.</p>
                </div>

                <form id="verify-form" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; max-width: 500px; margin-left: auto; margin-right: auto;">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <input type="text" id="verify-id" class="form-control" placeholder="Student ID (e.g. BC-02)" style="flex: 1; min-width: 180px; text-align: center; font-weight: 600;" required>
                        <input type="text" id="verify-name" class="form-control" placeholder="Student Full Name" style="flex: 1.5; min-width: 220px; text-align: center; font-weight: 600;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.75rem; align-self: center; width: 100%; max-width: 250px;"><i class="fa-solid fa-circle-check"></i> Verify Now</button>
                </form>

                <!-- Result Card Container -->
                <div id="verify-result" style="display: none; margin-top: 1.5rem;">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- --- FOOTER --- -->
    <footer class="footer" style="padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); background: var(--surface);">
        <div class="footer-bottom" style="margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; max-width: 1200px; margin-left: auto; margin-right: auto;">
            <p>&copy; 2026 Ediz IT Institute. All Rights Reserved.</p>
            <p>Designed and Built for Modern IT Education.</p>
        </div>
    </footer>

    <!-- --- CERTIFICATE VERIFICATION MODAL (Hidden Fallback for compatibility) --- -->
    <div id="verification-modal" class="modal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="modal-container glass-panel">
            <div class="modal-body" id="verification-modal-body"></div>
        </div>
    </div>

    <!-- --- HIDDEN PRINT AREA FOR A4 INVOICES AND CERTIFICATES --- -->
    <div id="print-zone" class="print-area">
        <!-- Rendered dynamically by javascript before printing -->
    </div>

    <!-- Script Entrypoint -->
    <script>
        const scriptPrefix = window.location.hostname.includes('verify.edizit.com') ? '' : '../';
        
        const s1 = document.createElement('script');
        s1.src = scriptPrefix + 'database_backup.js?v=20';
        s1.async = false;
        document.head.appendChild(s1);
        
        const s2 = document.createElement('script');
        s2.src = scriptPrefix + 'app.js?v=20';
        s2.async = false;
        s2.defer = true;
        document.head.appendChild(s2);
    </script>
</body>
</html>
